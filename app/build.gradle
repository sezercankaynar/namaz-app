plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sezercan.namazvakti'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sezercan.namazvakti'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }

    signingConfigs {
        // Kişisel kullanım için sabit anahtar: her yeni sürüm eski sürümün
        // üzerine (silmeden) kurulabilsin diye depoda tutuluyor.
        sabit {
            storeFile file('namaz.keystore')
            storePassword 'namazvakti'
            keyAlias 'namaz'
            keyPassword 'namazvakti'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sabit
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sabit
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '3g'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
